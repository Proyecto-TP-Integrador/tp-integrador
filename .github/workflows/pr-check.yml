# ============================================
# pr-check.yml — Checks rápidos en Pull Requests
# ============================================

name: PR Check

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    name: Validar PR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: app/backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r app/backend/requirements-dev.txt

      - name: Tests
        run: cd app/backend && pytest tests/ -v


      - name: Comentar resultado en el PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? 'OK' : 'ERR';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${status} **PR Check** — ${{ job.status }}\nCommit: \`${{ github.sha }}\``
            });
