name: CI/CD Pipeline - Notes App DevSecOps (4 Fases)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Mínimo privilegio para el GITHUB_TOKEN
permissions:
  contents: read

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devops-portfolio
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devops-frontend
  HELM_RELEASE_NAME: notes-app
  K8S_NAMESPACE: devops-portfolio
  # Rutas de la estructura del PIF
  BACKEND_DIR: app/backend
  FRONTEND_DIR: app/frontend
  CHART_DIR: helm/notes-app
  VALUES_PROD: helm/values-prod.yaml
  VALUES_DEV: helm/values-dev.yaml
  INGRESS_HOST: devops-portfolio.local
  GITLEAKS_VERSION: 8.18.2

jobs:
  # =========================================================================
  # FASE 1: BUILD & PACKAGE (Construcción de Imagen Inmutable)
  # =========================================================================
  build-and-package:
    name: "Fase 1: Build & Package (Imagen Inmutable)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: "Andon Cord: Hadolint sobre el Dockerfile"
        run: |
          docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold warning - < ${{ env.BACKEND_DIR }}/Dockerfile

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compilar imagen Docker
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} ./${{ env.BACKEND_DIR }}

      - name: Exportar imagen a tarball efímero
        run: |
          mkdir -p build-artifacts
          docker save ${{ env.DOCKER_IMAGE }}:${{ github.sha }} -o build-artifacts/app-image.tar

      - name: Publicar Artefacto de Imagen
        uses: actions/upload-artifact@v5
        with:
          name: docker-image-artifact
          path: build-artifacts/app-image.tar
          retention-days: 1

  # =========================================================================
  # FASE 2: AUDITORÍAS DE CIBERSEGURIDAD Y GENERACIÓN DE REPORTES
  # =========================================================================
  security-audits:
    name: "Fase 2: Auditorías (ZAP, Threagile, Semgrep, Trivy & Gitleaks)"
    runs-on: ubuntu-latest
    needs: [build-and-package]
    steps:
      - name: Checkout del código (Historial completo para Gitleaks)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Crear carpeta para reportes
        run: |
          mkdir -p reports-json
          # v2: ZAP corre con el usuario zap (uid 1000) y el runner con uid 1001
          chmod a+w reports-json

      - name: Descargar Artefacto de Imagen
        uses: actions/download-artifact@v5
        with:
          name: docker-image-artifact
          path: build-artifacts

      - name: Cargar imagen Docker compilada
        run: |
          docker load -i build-artifacts/app-image.tar

      - name: Instalar Helm CLI
        uses: azure/setup-helm@v5
        with:
          version: 'v3.13.0'

      # -------------------------------------------------------------
      # TP10B: Render First, Validate Second
      # Las plantillas Go del chart no son YAML válido hasta que Helm las
      # procesa. Se renderiza primero y se valida el YAML resultante, que es
      # exactamente lo que recibe el API Server de Kubernetes.
      # -------------------------------------------------------------
      - name: "TP10B: Helm lint (estructura y metadata del chart)"
        run: |
          helm lint ./${{ env.CHART_DIR }} -f ${{ env.VALUES_PROD }}
          helm lint ./${{ env.CHART_DIR }} -f ${{ env.VALUES_DEV }}

      - name: "TP10B: Renderizar Helm Chart (Render First)"
        run: |
          helm template ${{ env.HELM_RELEASE_NAME }} ./${{ env.CHART_DIR }} \
            -f ${{ env.VALUES_PROD }} \
            --set backend.image.repository=${{ env.DOCKER_IMAGE }} \
            --set backend.image.tag=${{ github.sha }} > manifests-rendered-prod.yaml
          helm template ${{ env.HELM_RELEASE_NAME }} ./${{ env.CHART_DIR }} \
            -f ${{ env.VALUES_DEV }} > manifests-rendered-dev.yaml
          test -s manifests-rendered-prod.yaml
          test -s manifests-rendered-dev.yaml

      - name: "TP10B: Validar el YAML renderizado (sintaxis, linter y checksums)"
        run: |
          python3 - <<'PY'
          import yaml
          for archivo in ("manifests-rendered-prod.yaml", "manifests-rendered-dev.yaml"):
              with open(archivo) as f:
                  docs = [d for d in yaml.safe_load_all(f) if d]
              print(f"[OK] {archivo}: YAML válido con {len(docs)} objetos de Kubernetes")
              for d in docs:
                  print(f"   - {d['kind']:24} -> {d['metadata']['name']}")
          PY
          # Linter estándar sobre el YAML ya procesado (sin falsos positivos por {{ }})
          pipx run --spec yamllint==1.35.1 yamllint \
            -d "{extends: relaxed, rules: {line-length: disable, trailing-spaces: disable}}" \
            manifests-rendered-prod.yaml manifests-rendered-dev.yaml
          # Las anotaciones checksum/* fuerzan el rolling update cuando cambian el
          # ConfigMap o el Secret; sólo tienen valor real después de renderizar
          for C in config secret; do
            grep -Eq "checksum/$C: [a-f0-9]{64}" manifests-rendered-prod.yaml \
              || { echo "::error::checksum/$C no se calculó en el render"; exit 1; }
            echo "[OK] checksum/$C calculado (SHA256)"
          done

      - name: "TP10B: Publicar los manifiestos renderizados"
        uses: actions/upload-artifact@v5
        with:
          name: manifiestos-k8s-renderizados
          path: manifests-rendered-*.yaml
          retention-days: 7

      - name: "Andon Cord: Checkov sobre el manifiesto renderizado"
        run: |
          pipx run --spec checkov==3.3.30 checkov -f manifests-rendered-prod.yaml \
            --config-file .checkov.yaml --compact \
            -o cli -o json --output-file-path console,reports-json/checkov-results.json

      - name: "Andon Cord: kube-linter sobre el manifiesto renderizado"
        run: |
          curl -sSfL https://github.com/stackrox/kube-linter/releases/download/v0.8.3/kube-linter-linux.tar.gz \
            | tar -xz -C /tmp kube-linter
          /tmp/kube-linter lint manifests-rendered-prod.yaml --config .kube-linter.yaml

      # -------------------------------------------------------------
      # 2A. OWASP ZAP DAST
      # -------------------------------------------------------------
      - name: Levantar Notes App efímera para DAST
        run: |
          docker network create zapnet
          docker run -d --name db --network zapnet \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=notesdb postgres:16-alpine
          docker run -d --name notes-backend --network zapnet -p 5000:5000 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            -e DB_HOST=db -e DB_PASSWORD=postgres ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          timeout 120 bash -c 'until curl -sf http://localhost:5000/health | grep -q connected; do sleep 3; done'
          curl -s -X POST -H "Content-Type: application/json" \
            -d '{"title":"PIF","content":"seed para ZAP"}' http://localhost:5000/api/notes

      - name: "AS-02: el runtime bloquea la escalada de privilegios"
        run: |
          docker exec notes-backend id
          if docker exec notes-backend sh -c 'touch /usr/bin/malware'; then
            echo "::error::El contenedor permitió escribir en /usr/bin"; exit 1
          fi
          if docker exec notes-backend sh -c 'chmod +s /app/app.py'; then
            echo "::error::El contenedor permitió activar el bit setuid"; exit 1
          fi
          echo "Escritura en el sistema de archivos y chmod +s bloqueados"

      - name: Ejecutar OWASP ZAP Baseline (reporte XML)
        run: |
          # v2: el parser "ZAP Scan" de DefectDojo solo acepta XML
          docker run --rm --network zapnet -v "$PWD/reports-json":/zap/wrk:rw \
            zaproxy/zap-stable zap-baseline.py -t http://notes-backend:5000/api/notes -x zap-report.xml -I
          test -s reports-json/zap-report.xml

      # -------------------------------------------------------------
      # 2B. THREAGILE THREAT MODELING
      # -------------------------------------------------------------
      - name: Ejecutar Threagile Threat Model Analysis
        uses: threagile/run-threagile-action@v1
        continue-on-error: true
        with:
          # v2: la action solo acepta model-file; la salida va a threagile/output/
          model-file: 'threat-model/threagile.yaml'

      - name: Copiar risks.json de Threagile
        run: |
          # v2: el archivo real es risks.json (no threagile-results.json)
          if [ -s threagile/output/risks.json ]; then
            cp threagile/output/risks.json reports-json/threagile-risks.json
          else
            echo "::warning::Threagile no generó risks.json"
          fi

      # -------------------------------------------------------------
      # 2C. SEMGREP SAST
      # -------------------------------------------------------------
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar Semgrep SAST
        run: |
          python3 -m pip install semgrep
          mkdir -p .semgrep-tmp
          cp manifests-rendered-prod.yaml .semgrep-tmp/helm-rendered.yaml
          # v2: p/owasp-top-ten (p/owasp-top-10 no existe en el registry de Semgrep)
          semgrep scan --config=p/owasp-top-ten --config=p/python --config=p/dockerfile --config=p/kubernetes \
            --no-git-ignore --json --output=reports-json/semgrep-results.json \
            app .semgrep-tmp || true

      # -------------------------------------------------------------
      # 2D. TRIVY CONTAINER, SCA E IaC
      # -------------------------------------------------------------
      # H-10: nombre fijo para que DefectDojo deduplique entre ejecuciones
      # (con el tag SHA, el "Target" del reporte cambia en cada commit)
      - name: Etiqueta fija para el escaneo de Trivy
        run: docker tag ${{ env.DOCKER_IMAGE }}:${{ github.sha }} notes-backend:scan

      - name: Ejecutar Trivy Container Scan
        # v2: versión fijada por SHA (v0.36.0) en lugar de @master
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'notes-backend:scan'
          format: 'json'
          output: 'reports-json/trivy-container-results.json'
          exit-code: '0'

      - name: Ejecutar Trivy SCA (dependencias PyPI)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '${{ env.BACKEND_DIR }}'
          scanners: 'vuln'
          format: 'json'
          output: 'reports-json/trivy-sca-results.json'
          exit-code: '0'

      - name: Ejecutar Trivy IaC sobre YAML Renderizado
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'config'
          scan-ref: 'manifests-rendered-prod.yaml'
          format: 'json'
          output: 'reports-json/trivy-iac-results.json'
          exit-code: '0'

      # -------------------------------------------------------------
      # 2E. GITLEAKS SECRET SCANNING
      # -------------------------------------------------------------
      - name: Ejecutar Gitleaks CLI
        run: |
          GL_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          wget -q "${GL_URL}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo mv gitleaks /usr/local/bin/
          # v2: --redact para no publicar secretos en texto plano dentro del artifact
          gitleaks detect --source . --redact --report-format json \
            --report-path reports-json/gitleaks-report.json || true

      - name: Publicar Artefacto de Reportes
        uses: actions/upload-artifact@v5
        with:
          name: security-json-reports
          path: reports-json/
          retention-days: 1

  # =========================================================================
  # FASE 3: CENTRALIZACIÓN Y DEDUPLICACIÓN EN OWASP DEFECTDOJO
  # =========================================================================
  defectdojo-import:
    name: "Fase 3: Centralización en DefectDojo (Vulnerability Management)"
    # v2: runner self-hosted en la VM de DefectDojo (ubuntu-latest no alcanza localhost:8080)
    runs-on: [self-hosted, pif]
    needs: [security-audits]
    # v2: nunca en pull_request (repo público + runner self-hosted); needs exige Fase 2 exitosa
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout del código (script de importación)
        uses: actions/checkout@v5

      - name: Descargar Reportes
        uses: actions/download-artifact@v5
        with:
          name: security-json-reports
          path: reports-json

      # v2: la action defectdojo/import-scan-action@v1 no existe; se reutiliza el script validado localmente
      - name: Importar reportes a DefectDojo (API v2)
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          ENGAGEMENT_NAME: CI/CD Automated Security Audits
          REPORTS_DIR: reports-json
        run: |
          bash scripts/verificar-defectdojo.sh | tee import.log

      - name: Resumen de Centralización en GitHub
        if: always()
        run: |
          {
            echo "### Centralización de Vulnerabilidades en DefectDojo :shield:"
            echo "Commit \`${{ github.sha }}\` importado en **CI/CD Automated Security Audits**."
            echo '```text'
            grep -E '\[(OK|FAIL|WARN)\]|Verificación completada' import.log || echo "Sin salida del script"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  # FASE 4A: RELEASE (Publicación, firma y SBOM de las imágenes)
  # =========================================================================
  deploy-k8s-helm:
    name: "Fase 4: Release (Docker Hub, Cosign & SBOM)"
    runs-on: ubuntu-latest
    needs: [build-and-package, security-audits, defectdojo-import]
    if: github.ref == 'refs/heads/main'
    # SS-03: id-token permite a Cosign firmar con la identidad OIDC del workflow (keyless)
    permissions:
      contents: read
      id-token: write
    # Sólo se pasan los digests: un output que contenga el valor de un secreto
    # (el usuario de Docker Hub forma parte del nombre de la imagen) se descarta
    outputs:
      backend_digest: ${{ steps.push.outputs.digest }}
      frontend_digest: ${{ steps.push-frontend.outputs.digest }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Descargar Artefacto de Imagen
        uses: actions/download-artifact@v5
        with:
          name: docker-image-artifact
          path: build-artifacts

      - name: Cargar imagen Docker probada
        run: |
          docker load -i build-artifacts/app-image.tar

      - name: "Andon Cord: Hadolint sobre el Dockerfile del frontend"
        run: |
          docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold warning - < ${{ env.FRONTEND_DIR }}/Dockerfile

      - name: Compilar imagen del frontend
        run: |
          docker build -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} ./${{ env.FRONTEND_DIR }}

      - name: "Andon Cord: Trivy sobre la imagen del frontend"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: '${{ env.FRONTEND_IMAGE }}:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push a Docker Hub (tag inmutable por SHA)
        id: push
        run: |
          docker push ${{ env.DOCKER_IMAGE }}:${{ github.sha }} | tee push.log
          DIGEST=$(grep -oE 'digest: sha256:[a-f0-9]{64}' push.log | awk '{print $2}' | tail -1)
          test -n "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.DOCKER_IMAGE }}@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Imagen publicada: ${{ env.DOCKER_IMAGE }}@$DIGEST"

      - name: Push del frontend a Docker Hub (tag inmutable por SHA)
        id: push-frontend
        run: |
          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} | tee push-frontend.log
          DIGEST=$(grep -oE 'digest: sha256:[a-f0-9]{64}' push-frontend.log | awk '{print $2}' | tail -1)
          test -n "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.FRONTEND_IMAGE }}@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Imagen publicada: ${{ env.FRONTEND_IMAGE }}@$DIGEST"

      - name: "SS-03: Instalar Cosign"
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.4'

      - name: "SS-03: Generar SBOM con Syft (SPDX)"
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.push.outputs.image }}
          registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
          registry-password: ${{ secrets.DOCKERHUB_TOKEN }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-notes-backend.spdx.json
          upload-release-assets: false

      - name: "SS-03: Generar SBOM del frontend con Syft (SPDX)"
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.push-frontend.outputs.image }}
          registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
          registry-password: ${{ secrets.DOCKERHUB_TOKEN }}
          format: spdx-json
          output-file: sbom-frontend.spdx.json
          artifact-name: sbom-notes-frontend.spdx.json
          upload-release-assets: false

      - name: "SS-03: Firmar las imágenes y adjuntar el SBOM (Cosign keyless)"
        run: |
          cosign sign --yes ${{ steps.push.outputs.image }}
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json ${{ steps.push.outputs.image }}
          cosign sign --yes ${{ steps.push-frontend.outputs.image }}
          cosign attest --yes --type spdxjson --predicate sbom-frontend.spdx.json ${{ steps.push-frontend.outputs.image }}

      - name: "Andon Cord: verificar firma y SBOM antes del despliegue"
        run: |
          ID='^https://github.com/${{ github.repository }}/.github/workflows/defectdojo-ci.yml@refs/heads/main$'
          ISSUER='https://token.actions.githubusercontent.com'
          for IMG in ${{ steps.push.outputs.image }} ${{ steps.push-frontend.outputs.image }}; do
            cosign verify "$IMG" \
              --certificate-identity-regexp "$ID" --certificate-oidc-issuer "$ISSUER" > /dev/null
            cosign verify-attestation --type spdxjson "$IMG" \
              --certificate-identity-regexp "$ID" --certificate-oidc-issuer "$ISSUER" > /dev/null
            echo "Firma y SBOM verificados en el log público de transparencia: $IMG"
          done

  # =========================================================================
  # FASE 4B: SECURITY GATE Y DESPLIEGUE CON HELM EN EL CLÚSTER
  # =========================================================================
  # Corre en el runner de ARC dentro del clúster, con la ServiceAccount
  # notes-deployer: permisos sólo sobre el namespace devops-portfolio.
  helm-deploy:
    name: "Fase 4: Security Gate & Deploy Helm (k3d)"
    runs-on: [self-hosted, pif]
    needs: [deploy-k8s-helm]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout del código (chart de Helm)
        uses: actions/checkout@v5

      # Anexo A §7: no se despliega con hallazgos CRITICAL o HIGH abiertos.
      # Abiertos = activos, sin mitigar, sin aceptación de riesgo vigente,
      # no falsos positivos y no duplicados.
      - name: "Security Gate: hallazgos CRITICAL/HIGH abiertos en DefectDojo"
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
        run: |
          set -euo pipefail
          Q="product_name=Notes%20App&active=true&is_mitigated=false&risk_accepted=false&false_p=false&duplicate=false&limit=100"
          TOTAL=0
          for S in Critical High; do
            curl -sf -H "Authorization: Token $DEFECTDOJO_API_KEY" \
              "$DEFECTDOJO_URL/api/v2/findings/?$Q&severity=$S" > "gate-$S.json"
            N=$(jq .count "gate-$S.json")
            echo "$S abiertos: $N"
            jq -r '.results[] | "  - [\(.severity)] \(.service // "-"): \(.title)"' "gate-$S.json"
            TOTAL=$((TOTAL + N))
          done
          {
            echo "### Security Gate :lock:"
            echo "Hallazgos CRITICAL/HIGH abiertos en DefectDojo: **$TOTAL**"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$TOTAL" -gt 0 ]; then
            echo "::error::Security Gate: $TOTAL hallazgos CRITICAL/HIGH abiertos. Despliegue bloqueado."
            exit 1
          fi
          echo "Security Gate aprobado: sin hallazgos CRITICAL/HIGH abiertos."

      - name: Instalar Helm CLI
        uses: azure/setup-helm@v5
        with:
          version: 'v3.13.0'

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.35.0'

      # TP10B [b]: el API Server valida el manifiesto renderizado con los mismos
      # valores del despliegue, sin modificar el clúster (dry-run del lado servidor)
      - name: "TP10B: Validación del manifiesto contra el API Server (dry-run)"
        run: |
          set -euo pipefail
          helm template ${{ env.HELM_RELEASE_NAME }} ./${{ env.CHART_DIR }} \
            -n ${{ env.K8S_NAMESPACE }} \
            -f ${{ env.VALUES_DEV }} \
            --set ingress.host=${{ env.INGRESS_HOST }} \
            --set backend.image.repository=${{ env.DOCKER_IMAGE }} \
            --set backend.image.tag=${{ github.sha }}@${{ needs.deploy-k8s-helm.outputs.backend_digest }} \
            --set frontend.image.repository=${{ env.FRONTEND_IMAGE }} \
            --set frontend.image.tag=${{ github.sha }}@${{ needs.deploy-k8s-helm.outputs.frontend_digest }} \
            > manifests-deploy.yaml
          kubectl apply --dry-run=server -f manifests-deploy.yaml

      # Imágenes por digest: el tag SHA es informativo, Kubernetes descarga
      # exactamente el digest firmado y verificado en la Fase 4A
      - name: Despliegue con Helm en Kubernetes
        run: |
          set -euo pipefail
          helm upgrade --install ${{ env.HELM_RELEASE_NAME }} ./${{ env.CHART_DIR }} \
            -n ${{ env.K8S_NAMESPACE }} \
            -f ${{ env.VALUES_DEV }} \
            --set ingress.host=${{ env.INGRESS_HOST }} \
            --set backend.image.repository=${{ env.DOCKER_IMAGE }} \
            --set backend.image.tag=${{ github.sha }}@${{ needs.deploy-k8s-helm.outputs.backend_digest }} \
            --set frontend.image.repository=${{ env.FRONTEND_IMAGE }} \
            --set frontend.image.tag=${{ github.sha }}@${{ needs.deploy-k8s-helm.outputs.frontend_digest }} \
            --atomic --wait --timeout 5m
          helm history ${{ env.HELM_RELEASE_NAME }} -n ${{ env.K8S_NAMESPACE }} --max 3

      - name: "Verificación: rollout, usuario sin privilegios y smoke test"
        run: |
          set -euo pipefail
          NS=${{ env.K8S_NAMESPACE }}
          kubectl -n $NS rollout status deploy/backend --timeout=120s
          kubectl -n $NS rollout status deploy/frontend --timeout=120s
          UID_APP=$(kubectl -n $NS exec deploy/backend -c backend -- id -u)
          echo "UID del proceso del backend: $UID_APP"
          test "$UID_APP" = "10001"
          # La API responde y además llega a PostgreSQL (credencial leída del archivo
          # del Secret y tráfico permitido por la NetworkPolicy)
          curl -sf "http://backend-service.$NS.svc:5000/health" | tee health.json; echo
          grep -q '"connected"' health.json
          curl -sf -o /dev/null -w "Frontend: HTTP %{http_code}\n" "http://frontend-service.$NS.svc/"
          curl -sf -H "Host: ${{ env.INGRESS_HOST }}" -o /dev/null -w "Ingress /api/notes: HTTP %{http_code}\n" \
            "http://ingress-nginx-controller.ingress-nginx.svc/api/notes"
          {
            echo "### Despliegue :rocket:"
            echo "Release \`${{ env.HELM_RELEASE_NAME }}\` en \`$NS\` con el commit \`${{ github.sha }}\`."
            echo '```text'
            kubectl -n $NS get deploy -o custom-columns=DEPLOY:.metadata.name,READY:.status.readyReplicas,IMAGEN:.spec.template.spec.containers[0].image
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
