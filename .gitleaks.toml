# Archivo de configuración personalizada: .gitleaks.toml (v2)
title = "Gitleaks Config - Notes App DevSecOps v2"

# v2: hereda las reglas por defecto; sin esto el archivo las reemplaza por ninguna
[extend]
useDefault = true

[allowlist]
description = "Permitir archivos de prueba y variables de test conocidas"
paths = [
  '''backend/tests/.*''',
  '''scripts/verificar.*\.sh'''
]
# SS-16: se quitaron devops123 y dev-password de la lista. Eran contraseñas
# reales del chart y la excepción ocultaba la credencial en lugar de corregirla.
regexes = [
  '''EXAMPLEKEY'''
]
