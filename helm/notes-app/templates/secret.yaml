{{- /*
SS-16 (CWE-798): la contraseña de PostgreSQL no está en el repositorio.
Orden de prioridad:
  1. postgres.credentials.password, si se pasa en el despliegue (rotación);
  2. la contraseña del Secret que ya existe en el clúster (lookup), para que un
     helm upgrade no cambie la clave de una base ya inicializada;
  3. una contraseña aleatoria de 32 caracteres en la primera instalación.
Con helm template no hay clúster: lookup devuelve vacío y se genera una
aleatoria, que es suficiente para el análisis estático.
*/ -}}
{{- $existente := lookup "v1" "Secret" .Values.global.namespace "postgres-secret" -}}
{{- $password := .Values.postgres.credentials.password -}}
{{- if and (not $password) $existente $existente.data -}}
{{- $password = index $existente.data "POSTGRES_PASSWORD" | default "" | b64dec -}}
{{- end -}}
{{- if not $password -}}
{{- $password = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "devops-portfolio.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_USER:     {{ .Values.postgres.credentials.user     | b64enc }}
  POSTGRES_PASSWORD: {{ $password                             | b64enc }}
  POSTGRES_DB:       {{ .Values.postgres.credentials.database | b64enc }}
